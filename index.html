<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simon game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simon Game</h1>
    <h2><button class="start">Start</button></h2>
    <div class="box">
        <div class="red btn" id="red"></div>
        <div class="yellow btn" id="yellow"></div>
    </div>
    <div class="box">
        <div class="green btn" id="green"></div>
        <div class="violet btn" id="violet"></div>
    </div>

    <button class="rulesbtn">Hold to see Rules</button>
    <div class="rules">
        <p>1. Click Start to begin the game.</p>
        <p>2. Watch the color that flashes.</p>
        <p>3. Click the same color box.</p>
        <p>4. Every level one more color is added.</p>
        <p>5. If you click wrong color, game is over.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
